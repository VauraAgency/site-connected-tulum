name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # One site with a light/dark toggle in the header.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /site-connected-tulum/
      - name: Assemble
        run: |
          mkdir -p site
          cp -r dist/client/. site/
          cp site/index.html site/404.html
          # old review link (/dark/) now just goes to the main site
          mkdir -p site/dark
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=/site-connected-tulum/"><link rel="canonical" href="/site-connected-tulum/"><a href="/site-connected-tulum/">Connected Tulum</a>' > site/dark/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
