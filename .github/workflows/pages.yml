name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Design A (light) lives at the root, design B (dark) at /dark/. Both share the same content file.
      - name: Build A (light)
        run: npm run build
        env:
          BASE_PATH: /site-connected-tulum/
          VITE_VARIANT: light
          VITE_OTHER_URL: /site-connected-tulum/dark/
      - run: mv dist/client dist/light
      - name: Build B (dark)
        run: npm run build
        env:
          BASE_PATH: /site-connected-tulum/dark/
          VITE_VARIANT: dark
          VITE_OTHER_URL: /site-connected-tulum/
      - run: mv dist/client dist/dark
      - name: Assemble
        run: |
          mkdir -p site
          cp -r dist/light/. site/
          mkdir -p site/dark
          cp -r dist/dark/. site/dark/
          cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
